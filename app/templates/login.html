{% extends "base.html" %}

{% block title %}Sign In — SkillBridge AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 54px; height: 54px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Welcome to SkillBridge AI</h4>
                    <p class="text-muted small">Sign in to your candidate account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" name="email" id="emailInput" class="form-control" required placeholder="candidate@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" name="password" id="passwordInput" class="form-control" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Credentials Quick Fill Box -->
                <div class="mt-4 p-3 bg-light rounded border">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary text-white mb-1">Demo Candidate</span>
                            <div class="small fw-semibold text-dark">sarathkumar@nexora.ai</div>
                            <div class="text-muted small">Password: <code>SkillBridge2026!</code></div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDemo()">
                            <i class="bi bi-lightning-charge me-1"></i> Use Demo
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 text-muted small">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo() {
    document.getElementById("emailInput").value = "sarathkumar@nexora.ai";
    document.getElementById("passwordInput").value = "SkillBridge2026!";
}
</script>
{% endblock %}
