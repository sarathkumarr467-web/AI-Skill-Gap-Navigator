{% extends "base.html" %}

{% block title %}Server Error (500) — SkillBridge AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card p-5 mx-auto shadow-sm border-0" style="max-width: 500px;">
        <i class="bi bi-exclamation-triangle-fill fs-1 text-danger mb-3"></i>
        <h3 class="fw-bold text-dark">Server Error</h3>
        <p class="text-muted small mb-4">An internal error occurred while processing your request. Please try again or return to the dashboard.</p>
        <div>
            <a href="{{ url_for('dashboard.dashboard') if session.get('user_id') else url_for('auth.index') }}" class="btn btn-primary px-4">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
