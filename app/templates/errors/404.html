{% extends "base.html" %}

{% block title %}Page Not Found (404) — SkillBridge AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card p-5 mx-auto shadow-sm border-0" style="max-width: 500px;">
        <i class="bi bi-compass fs-1 text-primary mb-3"></i>
        <h3 class="fw-bold text-dark">Page Not Found</h3>
        <p class="text-muted small mb-4">The career resource or page you are looking for does not exist or has moved.</p>
        <div>
            <a href="{{ url_for('dashboard.dashboard') if session.get('user_id') else url_for('auth.index') }}" class="btn btn-primary px-4">
                Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
